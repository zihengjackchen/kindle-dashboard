<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Dashboard</title>
<style>html,body{margin:0;width:100%;height:100%;background:white;color:black;font-family:sans-serif;overflow:hidden}table{width:100%;height:100%;border-collapse:collapse;table-layout:fixed}td{text-align:center;padding:0}#screen{width:100%;height:88%}#image{max-width:100%;max-height:100%}#controls{height:8%}button{font-size:22px;padding:12px 8px;background:white;border:2px solid black;width:23%;margin:0 0.5%;border-radius:7px}#status{height:4%;font-size:17px}#empty{font-size:24px;padding:20px}</style>
<script src="session.js"></script></head><body><table><tr id="screen"><td><img id="image" alt="Dashboard" style="display:none"><div id="empty">Loading your dashboard…</div></td></tr><tr id="controls"><td><button id="previous">Previous</button><button id="refresh">Refresh</button><button id="next">Next</button><button id="close">Close</button></td></tr><tr id="status"><td id="message"></td></tr></table><script src="app.js"></script></body></html>
