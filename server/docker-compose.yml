services:
  dashboard:
    build: .
    image: kindle-dashboard:local
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:8080:8080"
    environment:
      API_TOKEN: "${API_TOKEN:-}"
      DASHBOARD_TIMEZONE: "${DASHBOARD_TIMEZONE:-UTC}"
      DASHBOARD_SNAPSHOT_PATH: /data/snapshot.json
      DASHBOARD_STATE_PATH: /state/contacts.json
      DASHBOARD_LAYOUT_PATH: /state/layout.json
      CODEX_USAGE_PATH: /data/codex/usage.json
    volumes:
      - ./data:/data:ro
      - contact-state:/state
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m
    mem_limit: 256m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"
  collector:
    profiles: [live]
    build: .
    image: kindle-dashboard:local
    command: [python, -m, app.collect, --loop]
    env_file: .env
    environment:
      DASHBOARD_SNAPSHOT_PATH: /data/snapshot.json
      NAS_SNAPSHOT_PATH: /data/nas.json
    volumes:
      - ./data:/data
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -m, app.collect, --healthcheck]
      interval: 60s
      timeout: 5s
      start_period: 5m
      retries: 3
    mem_limit: 128m
    pids_limit: 32
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"
volumes:
  contact-state:
